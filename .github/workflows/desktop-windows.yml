name: Desktop Windows

on:
  push:
    branches:
      - desktopdev
      - windows
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set desktop build version
        run: node apps/desktop/scripts/set-ci-version.mjs

      - name: Build Windows desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter pilotdeck-desktop run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pilotdeck-desktop-windows
          path: apps/desktop/dist-electron/*-setup.exe
          if-no-files-found: error
