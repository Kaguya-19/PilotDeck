name: Desktop macOS

on:
  push:
    branches:
      - desktopdev
      - mac
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOS_SIGNING_IDENTITY: "Developer ID Application: Beijing ModelBest Technology Co., Ltd. (77Y5JFSH6H)"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set desktop build version
        run: node apps/desktop/scripts/set-ci-version.mjs

      - name: Import Developer ID Application certificate
        shell: bash
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id-application.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/pilotdeck-signing.keychain-db
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64" ]; then
            echo "No Developer ID Application certificate secret configured; using ad-hoc signing fallback."
            exit 0
          fi
          if [ -z "$MACOS_DEVELOPER_ID_APPLICATION_PASSWORD" ]; then
            echo "::error::MACOS_DEVELOPER_ID_APPLICATION_PASSWORD is required when MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 is configured."
            exit 1
          fi

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64"])
          )
          PY

          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-pilotdeck-ci-keychain}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_DEVELOPER_ID_APPLICATION_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$MACOS_SIGNING_IDENTITY"

          {
            echo "CSC_NAME=$MACOS_SIGNING_IDENTITY"
            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
          } >> "$GITHUB_ENV"

      - name: Build macOS desktop artifact
        env:
          PILOTDECK_DESKTOP_NODE_ARCH: universal
        run: pnpm --filter pilotdeck-desktop run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pilotdeck-desktop-macos
          path: apps/desktop/dist-electron/*.dmg
          if-no-files-found: error
