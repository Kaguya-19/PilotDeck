schemaVersion: 1
agent:
  model: smoke/operator
  params: {}
  subagents:
    default: inherit
    params: {}
model:
  providers:
    smoke:
      protocol: openai
      url: http://127.0.0.1:18092/v1
      apiKey: local-only
      models:
        operator:
          capabilities:
            supportsToolUse: true
memory:
  enabled: false
  reasoningMode: answer_first
  autoIndexIntervalMinutes: 30
  autoDreamIntervalMinutes: 60
  captureStrategy: last_turn
  includeAssistant: true
  maxMessageChars: 6000
  heartbeatBatchSize: 30
router:
  enabled: false
tools:
  webSearch:
    enabled: false
alwaysOn:
  projects: {}
adapters:
  feishu:
    enabled: false
  weixin:
    enabled: false
  wecom:
    enabled: false
webui:
  runtime:
    host: 0.0.0.0
    serverPort: 3001
    vitePort: 5173
    apiTimeoutMs: 120000
    databasePath: /tmp/pd-replacement-evidence/auth.db
    workspacesRoot: /Users/a1
  officePreview:
    service: builtin
    binaryPath: ""
telemetry:
  enabled: false
modules:
  agentLoop:
    enabled: true
    provider: pilotdeck
  skills:
    enabled: false
  tools:
    enabled: true
    provider: pilotdeck
  context:
    enabled: true
    provider: pilotdeck
  modelProvider:
    enabled: true
    provider: pilotdeck
  sop:
    enabled: false
  knowledge:
    enabled: true
    implementationId: replacement.knowledge
    frontendModule: fixture.knowledge-search
    contract: staffdeck.knowledge/v1
    transport: module-http-v2
    endpoint: http://127.0.0.1:18093
    methods:
      - query
      - resolve_citation
    resultLimit: 3
